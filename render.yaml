services:
  - type: web
    name: reality-exe
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: reality-private-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AGENT_API_TOKEN
        generateValue: true
      - key: DATABASE_URL
        value: file:/app/data/reality.db
      - key: EVIDENCE_DRIVER
        value: local
      - key: EVIDENCE_DIR
        value: /app/data/evidence
      - key: OG_API_KEY
        sync: false
      - key: OG_MODEL
        value: 0gm-1.0-35b-a3b
      - key: OG_TRUST_MODE
        value: private
      - key: HEDERA_MERCHANT_ACCOUNT_ID
        sync: false
      - key: HEDERA_BUYER_ACCOUNT_ID
        sync: false
      - key: HEDERA_BUYER_PRIVATE_KEY
        sync: false
      - key: WORLD_APP_ID
        sync: false
      - key: WORLD_RP_ID
        sync: false
      - key: WORLD_RP_SIGNING_KEY
        sync: false
      - key: WORLD_ACTION
        value: claim-mission
      - key: WORLD_ENVIRONMENT
        value: staging
